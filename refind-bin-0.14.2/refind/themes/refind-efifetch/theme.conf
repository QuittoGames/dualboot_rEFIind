# hide some elements
hideui badges,arrows,hints,label

# set the icon location
icons_dir themes/refind-efifetch/icons

# set the background
banner themes/refind-efifetch/background.png
banner_scale fillscreen

# the icon sizes
small_icon_size 64

# make boot a little cleaner
use_graphics_for osx,linux,elilo,grub,windows

selection_small themes/refind-efifetch/selection_small.png

# only show shutdown and bios
showtools shutdown

# only show two icons at a time
max_tags 2

# timeout for boot
timeout 20
z